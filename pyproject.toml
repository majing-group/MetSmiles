[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metsmiles"
version = "0.3.0"
description = "MetSMILES: coordination-environment-aware SMILES annotation for metal complexes"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "chemistry",
    "SMILES",
    "metal complexes",
    "coordination chemistry",
    "machine learning",
    "molecular representation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
]

[project.urls]
Homepage = "https://github.com/majing-group/MetSmiles"
Repository = "https://github.com/majing-group/MetSmiles"

[project.optional-dependencies]
molecular = ["rdkit>=2022.9"]
dev = [
    "pytest>=7.0",
]
crystal = [
    "spglib>=2.0",
    "rdkit>=2022.9",
]

[project.scripts]
metsmiles = "metsmiles.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metsmiles = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
