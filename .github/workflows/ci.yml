name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        extras: [minimal, full]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal dependencies
        if: matrix.extras == 'minimal'
        run: python -m pip install '.[dev]' build
      - name: Install optional molecular and crystal dependencies
        if: matrix.extras == 'full'
        run: python -m pip install '.[dev,molecular,crystal]' build
      - name: Test source package
        run: python -m pytest -q -W error
      - name: Run minimal examples
        run: |
          python examples/run_example.py --prefix-mode suffix-only
          python -m metsmiles examples/data/mil-88b.cif --no-ligands --no-symmetry-detection
      - name: Run optional examples
        if: matrix.extras == 'full'
        run: |
          python examples/run_example.py
          python examples/run_mof.py
          python -m metsmiles examples/figure2/48.xyz --sdf examples/figure2/48.sdf
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install and test wheel outside source tree
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cp -r tests examples /tmp/
          cd /tmp
          python -m pytest tests -q -W error
          python -c "import metsmiles; assert metsmiles.__version__ == '0.3.0'; print(metsmiles.__file__)"
      - name: Test source distribution and fixtures
        run: |
          mkdir /tmp/metsmiles-sdist
          tar -xzf dist/*.tar.gz --strip-components=1 -C /tmp/metsmiles-sdist
          cd /tmp/metsmiles-sdist
          PYTHONPATH=src python -m pytest -q -W error
